# Trading Service Configuration
# Mode: PAPER for testing, LIVE for real trading
mode: PAPER

# Trading style: intraday or swing
trading_style: intraday  # intraday or swing

# Trading capital
capital: 100000

# Broker configuration
broker:
  name: zerodha
  # API credentials loaded from environment variables:
  # KITE_API_KEY and KITE_API_SECRET

# Intraday session timings (IST)
intraday:
  start_time: "09:15"
  last_entry_time: "14:30"
  square_off_time: "15:15"
  opening_range_minutes: 15
  pre_market_start: "09:00"

# Swing trading configuration
swing:
  min_holding_days: 2
  max_holding_days: 15
  entry_window_start: "09:30"  # Wait for initial volatility to settle
  entry_window_end: "15:00"
  weekly_analysis_day: "friday"  # Day to review and rebalance
  use_weekly_pivots: true
  trend_lookback_days: 50

# Intraday strategy configuration
strategy:
  type: breakout
  sr_lookback_days: 20
  volume_surge_multiplier: 1.5
  min_risk_reward: 2.0
  breakout_confirmation_candles: 1
  atr_period: 14
  pivot_type: standard  # standard, fibonacci, camarilla

# Swing strategy configuration  
swing_strategy:
  type: trend_breakout
  sr_lookback_days: 60
  volume_surge_multiplier: 1.3
  min_risk_reward: 2.5
  atr_period: 14
  atr_multiplier_sl: 2.0  # SL at 2x ATR
  pivot_type: fibonacci
  trend_ema_short: 20
  trend_ema_long: 50
  breakout_confirmation_days: 1
  consolidation_min_days: 5

# Intraday risk management
risk:
  max_positions: 5
  risk_per_trade: 0.005  # 0.5% of capital per trade
  max_daily_loss: 0.02   # 2% daily loss limit
  sl_buffer_percent: 0.1
  move_sl_to_breakeven_at: 1.0  # Move SL to BE at 1:1 R:R
  trailing_sl_enabled: false
  max_capital_per_trade: 0.2  # Max 20% capital per trade

# Swing risk management
swing_risk:
  max_positions: 8
  risk_per_trade: 0.01   # 1% of capital per trade (wider stops)
  max_weekly_loss: 0.05  # 5% weekly loss limit
  sl_buffer_percent: 0.2
  move_sl_to_breakeven_at: 1.5  # Move SL to BE at 1.5:1 R:R
  trailing_sl_enabled: true
  trailing_sl_atr_multiplier: 1.5
  max_capital_per_trade: 0.15  # Max 15% capital per trade
  max_sector_exposure: 0.30    # Max 30% in one sector

# LLM configuration
# Supported providers: openai, ollama, llamacpp, lmstudio
llm:
  enabled: true
  provider: ollama           # Use local Ollama
  model: llama3.2            # Model name in Ollama
  base_url: http://localhost:11434  # Ollama default port
  validate_all_trades: false
  sentiment_check: false

# Alternative LLM configurations (uncomment to use):
#
# OpenAI:
# llm:
#   enabled: true
#   provider: openai
#   model: gpt-4o-mini
#
# LM Studio:
# llm:
#   enabled: true
#   provider: lmstudio
#   model: local-model
#   base_url: http://localhost:1234
#
# llama.cpp server:
# llm:
#   enabled: true
#   provider: llamacpp
#   model: llama3
#   base_url: http://localhost:8080

